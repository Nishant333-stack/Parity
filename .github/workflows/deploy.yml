name: Deploy

# Manually triggered. No stored AWS credentials: GitHub's OIDC token is
# exchanged for a short-lived session as parity-github-actions-deploy, which
# only orchestrates the deploy (CloudFormation changeset calls, CDK asset
# upload) and PassRoles into parity-cfn-exec-role — a second role, trusted
# only by cloudformation.amazonaws.com, that CloudFormation itself assumes to
# actually touch resources. Neither role is the CDK bootstrap's
# cfn-exec-role, which carries AdministratorAccess on this account.
# See scripts/setup-github-oidc.sh for the full reasoning.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify synthesized template
        run: npm run verify:template

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: cdk deploy
        run: npx cdk deploy --require-approval never --role-arn "${{ vars.AWS_CFN_EXEC_ROLE_ARN }}"
