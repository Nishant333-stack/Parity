name: Deploy

# Runs automatically on every push to main (i.e. every merge), and can still
# be triggered by hand. No stored AWS credentials: GitHub's OIDC token is
# exchanged for a short-lived session as parity-github-actions-deploy, which
# only orchestrates the deploy (CloudFormation changeset calls, CDK asset
# upload) and PassRoles into parity-cfn-exec-role — a second role, trusted
# only by cloudformation.amazonaws.com, that CloudFormation itself assumes to
# actually touch resources. Neither role is the CDK bootstrap's
# cfn-exec-role, which carries AdministratorAccess on this account.
# See scripts/setup-github-oidc.sh for the full reasoning.
#
# Proven working manually first (workflow_dispatch) before this trigger was
# added — every permission gap below (a bad OIDC trust condition, a missing
# iam:PassRole, two different ssm:GetParameter[s] actions) was found by
# actually running it against the real account, not by reasoning about IAM
# in the abstract.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify synthesized template
        run: npm run verify:template

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: cdk deploy
        run: npx cdk deploy --require-approval never --role-arn "${{ vars.AWS_CFN_EXEC_ROLE_ARN }}"
